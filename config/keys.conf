# Клавиши табличного процессора, это значения по умолчанию.
# Формат: клавиша = действие. Строки с # в начале это комментарии.
# Можно назначить только часть клавиш, остальные останутся как здесь.
# Саму клавишу = назначают так: = = save
#
# Клавиши: up down left right enter esc backspace delete tab home end
# pageup pagedown f1..f12, ctrl+<клавиша>, любой один символ (h, ?, ж).

# перемещение
up = move-up
k = move-up
down = move-down
j = move-down
left = move-left
h = move-left
right = move-right
l = move-right
pageup = page-up
pagedown = page-down
home = go-home
ctrl+home = go-top

# правка
enter = start-edit
f2 = start-edit
delete = clear-cell
ctrl+z = undo
ctrl+y = redo

# оформление
> = column-wider
< = column-narrower

# остальное
: = command-mode
? = show-help
f1 = show-help
ctrl+s = save
ctrl+q = quit
